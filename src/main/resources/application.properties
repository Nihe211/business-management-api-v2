spring.application.name=business-management-api-v2
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# update: Hibernate tự tạo/sửa bảng theo Entity. Chỉ để học, Phase 9 sẽ đổi sang Flyway
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET}
# Access token sống 15 phút
app.jwt.access-expiration-ms=900000
# Refresh token sống 7 ngày
app.jwt.refresh-expiration-ms=604800000
# Dev dùng http thì để false. Khi chạy HTTPS phải đổi thành true
app.cookie.secure=false